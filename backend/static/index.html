<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Document Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
        colors: {
          ink: '#111827',
          accent: '#4F46E5',
          canvas: '#FAFAFA',
        },
        borderRadius: { xl2: '20px' },
        boxShadow: {
          soft: '0 1px 2px rgba(17,24,39,0.04), 0 8px 24px -8px rgba(17,24,39,0.08)',
          softer: '0 1px 2px rgba(17,24,39,0.03), 0 2px 8px -2px rgba(17,24,39,0.06)',
        },
        keyframes: {
          fadeUp: { '0%': { opacity: 0, transform: 'translateY(8px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
          popIn: { '0%': { opacity: 0, transform: 'scale(0.92)' }, '100%': { opacity: 1, transform: 'scale(1)' } },
          pulseRing: { '0%': { boxShadow: '0 0 0 0 rgba(79,70,229,0.35)' }, '100%': { boxShadow: '0 0 0 8px rgba(79,70,229,0)' } },
        },
        animation: {
          fadeUp: 'fadeUp 0.35s ease-out',
          popIn: 'popIn 0.3s cubic-bezier(0.34,1.56,0.64,1)',
          pulseRing: 'pulseRing 1.4s ease-out infinite',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui; }
  textarea#prompt { field-sizing: content; }
  .chip { transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease; }
  .chip:hover { transform: translateY(-1px); }
  .btn-primary { transition: transform .15s ease, box-shadow .15s ease, opacity .15s; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px -6px rgba(79,70,229,0.5); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .card-hover { transition: transform .2s ease, box-shadow .2s ease; }
  .card-hover:hover { transform: translateY(-2px); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(17,24,39,0.15); border-radius: 8px; }
  .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); }
  /* Plain CSS rather than Tailwind's bg-canvas/dark:bg-gray-950 utility pair: the
     Play CDN's JIT engine was observed inserting the custom "canvas"/"ink" theme
     color rules later in the cascade than built-in dark: variants (which use a
     low-specificity :where(.dark) selector as of Tailwind 3.4+), so the custom
     color won regardless of dark mode state. Standard-color dark: pairs elsewhere
     (bg-white/dark:bg-gray-900 on cards) were unaffected and don't need this. */
  body { background-color: #FAFAFA; color: #111827; }
  html.dark body { background-color: #030712; color: #f3f4f6; }
</style>
</head>
<body class="min-h-screen transition-colors">

<canvas id="confetti" class="fixed inset-0 pointer-events-none z-50"></canvas>

<div class="max-w-2xl mx-auto px-5 sm:px-6 py-8 sm:py-12">

  <!-- Top bar -->
  <header class="flex items-center justify-between mb-10">
    <div class="flex items-center gap-2">
      <span class="text-xl">✨</span>
      <span class="font-semibold tracking-tight text-lg">AI Document Studio</span>
    </div>
    <div class="flex items-center gap-3">
      <span id="queue-badge" class="hidden items-center gap-1.5 text-xs font-medium text-gray-500 dark:text-gray-400 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-full px-3 py-1.5 shadow-softer">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="queue-count-text">0 running</span>
      </span>
      <button id="theme-toggle" class="p-2 rounded-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 shadow-softer hover:-translate-y-0.5 transition-transform" aria-label="Toggle dark mode">
        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
      </button>
    </div>
  </header>

  <!-- Hero -->
  <section class="text-center mb-8">
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight mb-3">Create beautiful documents<br class="hidden sm:block" /> using natural language</h1>
    <p class="text-gray-500 dark:text-gray-400 text-base">DOCX, PPTX, XLSX and PDF — the format is detected automatically.</p>
  </section>

  <!-- Composer -->
  <section class="bg-white dark:bg-gray-900 rounded-xl2 shadow-soft border border-gray-100 dark:border-gray-800 p-4 sm:p-5 mb-4">
    <textarea
      id="prompt"
      rows="3"
      class="w-full resize-none bg-transparent outline-none placeholder:text-gray-400 text-base leading-relaxed max-h-56"
      placeholder="What would you like to create today? e.g. Create a healthcare proposal for..."
    ></textarea>
    <div class="flex items-center justify-end pt-2 border-t border-gray-100 dark:border-gray-800 mt-2">
      <button id="generate-btn" class="btn-primary flex items-center gap-2 bg-accent text-white text-sm font-medium px-5 py-2.5 rounded-full shadow-soft">
        <span id="generate-label">Generate Document</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </div>
  </section>

  <!-- Suggested prompts -->
  <section id="suggestions" class="flex flex-wrap gap-2 justify-center mb-10">
    <!-- populated by JS -->
  </section>

  <!-- Pipeline -->
  <section id="pipeline-card" class="hidden bg-white dark:bg-gray-900 rounded-xl2 shadow-soft border border-gray-100 dark:border-gray-800 p-5 sm:p-6 mb-6 animate-fadeUp">
    <div class="flex items-center justify-between mb-5">
      <h2 class="font-semibold text-sm text-gray-700 dark:text-gray-300">Live Generation</h2>
      <span id="pipeline-elapsed" class="text-xs font-mono text-gray-400">0:00</span>
    </div>
    <ol id="pipeline-steps" class="space-y-0"></ol>
  </section>

  <!-- Result -->
  <section id="result-card" class="hidden mb-6"></section>

  <!-- Error -->
  <section id="error-card" class="hidden mb-6"></section>

  <!-- Recent -->
  <section class="mt-14">
    <h2 class="text-sm font-semibold text-gray-500 dark:text-gray-400 mb-3 px-1">Recent generations</h2>
    <div id="recent-list" class="space-y-2">
      <p id="recent-empty" class="text-sm text-gray-400 px-1">Nothing generated yet this session.</p>
    </div>
  </section>

</div>

<script>
const PIPELINE_STEPS = [
  { key: 'planner',      label: 'Planning',     note: null },
  { key: 'research',     label: 'Research',     note: null },
  { key: 'content',      label: 'Writing',      note: null },
  { key: 'layout',       label: 'Layout',       note: null },
  { key: 'office_skill', label: 'Office Skill', note: 'Claude writes and runs real generation code here — usually the slowest step, up to ~10 minutes.' },
  { key: 'validation',   label: 'Validation',   note: null },
  { key: 'export',       label: 'Export',       note: null },
];

const SUGGESTIONS = [
  { label: 'Investor Pitch Deck', prompt: 'Create a 4-slide investor pitch deck for a new SaaS product: title, problem, solution, and a call-to-action slide.' },
  { label: 'Annual Report', prompt: 'Write a one-page annual report summary covering highlights, financial overview, and outlook for next year.' },
  { label: 'Healthcare Proposal', prompt: 'Draft a healthcare service proposal document with sections for scope, approach, timeline, and pricing.' },
  { label: 'Resume', prompt: 'Create a clean one-page resume for a senior software engineer with 8 years of experience in backend systems.' },
  { label: 'Research Paper', prompt: 'Write a short research paper abstract and introduction on the impact of remote work on team productivity.' },
  { label: 'Meeting Minutes', prompt: 'Create meeting minutes for a weekly product sync, with attendees, decisions made, and action items.' },
];

const FORMAT_META = {
  docx: { icon: 'file-text', label: 'DOCX', color: 'text-blue-600 bg-blue-50 dark:bg-blue-950 dark:text-blue-400' },
  pptx: { icon: 'presentation', label: 'PPTX', color: 'text-orange-600 bg-orange-50 dark:bg-orange-950 dark:text-orange-400' },
  xlsx: { icon: 'table-2', label: 'XLSX', color: 'text-emerald-600 bg-emerald-50 dark:bg-emerald-950 dark:text-emerald-400' },
  pdf:  { icon: 'file', label: 'PDF', color: 'text-red-600 bg-red-50 dark:bg-red-950 dark:text-red-400' },
};

let elapsedTimer = null;
let jobStartTime = null;

// ---------- theme ----------
function initTheme() {
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (saved === 'dark' || (!saved && prefersDark)) document.documentElement.classList.add('dark');
}
document.getElementById('theme-toggle').addEventListener('click', () => {
  document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
});
initTheme();

// ---------- suggestions ----------
const suggestionsEl = document.getElementById('suggestions');
SUGGESTIONS.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'chip text-sm px-3.5 py-1.5 rounded-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 shadow-softer text-gray-600 dark:text-gray-300 hover:border-accent hover:text-accent';
  btn.textContent = s.label;
  btn.addEventListener('click', () => {
    const promptEl = document.getElementById('prompt');
    promptEl.value = s.prompt;
    promptEl.focus();
  });
  suggestionsEl.appendChild(btn);
});

// ---------- pipeline rendering ----------
function renderPipeline(currentStep, status) {
  const el = document.getElementById('pipeline-steps');
  const currentIndex = PIPELINE_STEPS.findIndex(s => s.key === currentStep);
  el.innerHTML = PIPELINE_STEPS.map((step, i) => {
    let state = 'waiting';
    if (status === 'completed' || i < currentIndex) state = 'done';
    else if (i === currentIndex) state = status === 'failed' ? 'failed' : 'running';

    const dot = {
      waiting: '<span class="w-5 h-5 rounded-full border-2 border-gray-200 dark:border-gray-700 block"></span>',
      running: '<span class="relative flex items-center justify-center w-5 h-5 rounded-full bg-accent animate-pulseRing"><span class="w-2 h-2 rounded-full bg-white"></span></span>',
      done: '<span class="w-5 h-5 rounded-full bg-emerald-500 flex items-center justify-center text-white"><i data-lucide="check" class="w-3 h-3"></i></span>',
      failed: '<span class="w-5 h-5 rounded-full bg-red-500 flex items-center justify-center text-white"><i data-lucide="x" class="w-3 h-3"></i></span>',
    }[state];

    const textClass = {
      waiting: 'text-gray-400 dark:text-gray-600',
      running: 'text-ink dark:text-white font-medium',
      done: 'text-gray-500 dark:text-gray-400',
      failed: 'text-red-600 dark:text-red-400 font-medium',
    }[state];

    const isLast = i === PIPELINE_STEPS.length - 1;
    return `
      <li class="flex gap-3 ${isLast ? '' : 'pb-4'} relative">
        ${isLast ? '' : `<span class="absolute left-2.5 top-6 bottom-0 w-px ${state === 'done' ? 'bg-emerald-200 dark:bg-emerald-900' : 'bg-gray-100 dark:bg-gray-800'}"></span>`}
        <div class="pt-0.5">${dot}</div>
        <div class="flex-1 min-w-0">
          <p class="text-sm ${textClass}">${step.label}</p>
          ${state === 'running' && step.note ? `<p class="text-xs text-gray-400 dark:text-gray-500 mt-1">${step.note}</p>` : ''}
        </div>
      </li>`;
  }).join('');
  lucide.createIcons();
}

function startElapsedTimer() {
  jobStartTime = Date.now();
  const elapsedEl = document.getElementById('pipeline-elapsed');
  clearInterval(elapsedTimer);
  elapsedTimer = setInterval(() => {
    const secs = Math.floor((Date.now() - jobStartTime) / 1000);
    elapsedEl.textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  }, 1000);
}
function stopElapsedTimer() { clearInterval(elapsedTimer); }

// ---------- result / error rendering ----------
function formatBytes(bytes) {
  if (!bytes) return '';
  const kb = bytes / 1024;
  return kb > 1024 ? `${(kb / 1024).toFixed(1)} MB` : `${Math.round(kb)} KB`;
}

function renderResult(job, jobId) {
  const meta = FORMAT_META[job.format] || FORMAT_META.docx;
  const duration = job.finished_at && job.created_at ? Math.round(job.finished_at - job.created_at) : null;
  const el = document.getElementById('result-card');
  el.innerHTML = `
    <div class="bg-white dark:bg-gray-900 rounded-xl2 shadow-soft border border-gray-100 dark:border-gray-800 p-5 sm:p-6 animate-popIn">
      <div class="flex items-start gap-4">
        <div class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 ${meta.color}">
          <i data-lucide="${meta.icon}" class="w-5 h-5"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold truncate">${job.title || 'Untitled document'}</p>
          <div class="flex flex-wrap items-center gap-2 mt-1 text-xs text-gray-500 dark:text-gray-400">
            <span class="font-medium ${meta.color} px-2 py-0.5 rounded-full">${meta.label}</span>
            ${job.size_bytes ? `<span>${formatBytes(job.size_bytes)}</span>` : ''}
            ${duration !== null ? `<span>Generated in ${duration}s</span>` : ''}
          </div>
          <p class="flex items-center gap-1.5 text-xs text-emerald-600 dark:text-emerald-400 mt-2">
            <i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>
            ${job.validation && job.validation.ok ? (job.validation.details || 'Validated') : 'Validated'}
          </p>
        </div>
      </div>
      <a href="/jobs/${jobId}/download" class="btn-primary mt-5 flex items-center justify-center gap-2 w-full bg-accent text-white text-sm font-medium px-5 py-2.5 rounded-full shadow-soft">
        <i data-lucide="download" class="w-4 h-4"></i> Download ${meta.label}
      </a>
    </div>`;
  el.classList.remove('hidden');
  lucide.createIcons();
}

function renderError(message) {
  const el = document.getElementById('error-card');
  el.innerHTML = `
    <div class="bg-white dark:bg-gray-900 rounded-xl2 shadow-soft border border-red-100 dark:border-red-900 p-5 animate-popIn">
      <div class="flex items-start gap-3">
        <div class="w-9 h-9 rounded-xl bg-red-50 dark:bg-red-950 text-red-600 dark:text-red-400 flex items-center justify-center shrink-0">
          <i data-lucide="alert-triangle" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-medium text-sm">Generation failed</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 break-words">${message}</p>
        </div>
      </div>
    </div>`;
  el.classList.remove('hidden');
  lucide.createIcons();
}

// ---------- confetti (tiny, no external lib) ----------
function fireConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#4F46E5', '#111827', '#10B981', '#F59E0B'];
  const pieces = Array.from({ length: 80 }, () => ({
    x: canvas.width / 2 + (Math.random() - 0.5) * 200,
    y: canvas.height * 0.3,
    vx: (Math.random() - 0.5) * 8,
    vy: Math.random() * -6 - 2,
    size: Math.random() * 6 + 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    rotation: Math.random() * 360,
    vr: (Math.random() - 0.5) * 12,
  }));
  let frame = 0;
  function tick() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.vy += 0.25;
      p.x += p.vx;
      p.y += p.vy;
      p.rotation += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate((p.rotation * Math.PI) / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
      ctx.restore();
    });
    frame++;
    if (frame < 90) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  tick();
}

// ---------- recent list ----------
function timeAgo(ts) {
  const secs = Math.floor(Date.now() / 1000 - ts);
  if (secs < 60) return 'just now';
  if (secs < 3600) return `${Math.floor(secs / 60)}m ago`;
  if (secs < 86400) return `${Math.floor(secs / 3600)}h ago`;
  return `${Math.floor(secs / 86400)}d ago`;
}

const STATUS_BADGE = {
  pending: '<span class="text-xs text-gray-400">Queued</span>',
  running: '<span class="text-xs text-accent flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-accent animate-pulse"></span>Running</span>',
  completed: '<span class="text-xs text-emerald-600 dark:text-emerald-400">Completed</span>',
  failed: '<span class="text-xs text-red-500">Failed</span>',
};

async function refreshRecent() {
  try {
    const res = await fetch('/jobs');
    const jobs = await res.json();
    const entries = Object.entries(jobs).sort((a, b) => (b[1].created_at || 0) - (a[1].created_at || 0));

    document.getElementById('recent-empty').classList.toggle('hidden', entries.length > 0);

    const runningCount = entries.filter(([, j]) => j.status === 'running' || j.status === 'pending').length;
    const badge = document.getElementById('queue-badge');
    badge.classList.toggle('hidden', runningCount === 0);
    badge.classList.toggle('flex', runningCount > 0);
    document.getElementById('queue-count-text').textContent = `${runningCount} running`;

    const listEl = document.getElementById('recent-list');
    listEl.querySelectorAll('.recent-item').forEach(n => n.remove());

    entries.slice(0, 8).forEach(([jobId, job]) => {
      const meta = FORMAT_META[job.result?.format] || null;
      const div = document.createElement('div');
      div.className = 'recent-item card-hover flex items-center gap-3 bg-white dark:bg-gray-900 border border-gray-100 dark:border-gray-800 rounded-2xl px-4 py-3 shadow-softer';
      div.innerHTML = `
        <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${meta ? meta.color : 'bg-gray-100 dark:bg-gray-800 text-gray-400'}">
          <i data-lucide="${meta ? meta.icon : 'file-question'}" class="w-4 h-4"></i>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm truncate">${job.result?.title || job.request || 'Untitled'}</p>
          <div class="flex items-center gap-2 mt-0.5">
            ${STATUS_BADGE[job.status] || ''}
            <span class="text-xs text-gray-400">${job.created_at ? timeAgo(job.created_at) : ''}</span>
          </div>
        </div>
        ${job.status === 'completed'
          ? `<a href="/jobs/${jobId}/download" class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400 shrink-0"><i data-lucide="download" class="w-4 h-4"></i></a>`
          : ''}
      `;
      listEl.appendChild(div);
    });
    lucide.createIcons();
  } catch (e) { /* non-critical */ }
}
refreshRecent();
setInterval(refreshRecent, 8000);

// ---------- generate flow ----------
const generateBtn = document.getElementById('generate-btn');
const generateLabel = document.getElementById('generate-label');
const promptEl = document.getElementById('prompt');

async function poll(jobId) {
  const res = await fetch(`/jobs/${jobId}`);
  const job = await res.json();

  if (job.status === 'failed') {
    stopElapsedTimer();
    renderPipeline(job.current_step, 'failed');
    renderError(job.error || 'Unknown error');
    generateBtn.disabled = false;
    generateLabel.textContent = 'Generate Document';
    refreshRecent();
    return;
  }

  if (job.status === 'completed') {
    stopElapsedTimer();
    renderPipeline('export', 'completed');
    renderResult(job, jobId);
    fireConfetti();
    generateBtn.disabled = false;
    generateLabel.textContent = 'Generate Document';
    refreshRecent();
    return;
  }

  renderPipeline(job.current_step, job.status);
  setTimeout(() => poll(jobId), 2500);
}

generateBtn.addEventListener('click', async () => {
  const text = promptEl.value.trim();
  if (!text || generateBtn.disabled) return;

  document.getElementById('result-card').classList.add('hidden');
  document.getElementById('error-card').classList.add('hidden');
  document.getElementById('pipeline-card').classList.remove('hidden');
  generateBtn.disabled = true;
  generateLabel.textContent = 'Generating…';
  renderPipeline(null, 'pending');
  startElapsedTimer();

  const res = await fetch('/generate', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ request: text }),
  });

  if (!res.ok) {
    stopElapsedTimer();
    renderError(`Request failed (HTTP ${res.status})`);
    generateBtn.disabled = false;
    generateLabel.textContent = 'Generate Document';
    return;
  }

  const { job_id } = await res.json();
  refreshRecent();
  poll(job_id);
});

promptEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generateBtn.click();
});

lucide.createIcons();
</script>
</body>
</html>
